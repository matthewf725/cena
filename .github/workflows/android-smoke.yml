name: Android app smoke

on:
  push:
    branches: [main]
    paths:
      - 'native/android/**'
      - 'scripts/android-smoke.sh'
      - '.github/workflows/android-smoke.yml'
  pull_request:
    paths:
      - 'native/android/**'
      - 'scripts/android-smoke.sh'
      - '.github/workflows/android-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: bash gradlew :customer:assembleDebug :restaurant:assembleDebug
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator and verify both launch screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          working-directory: .
          script: bash scripts/android-smoke.sh
