name: iOS app smoke

on:
  push:
    branches: [main]
    paths:
      - 'native/ios/**'
      - '.github/workflows/ios-smoke.yml'
  pull_request:
    paths:
      - 'native/ios/**'
      - '.github/workflows/ios-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scheme: [CenaCustomerSmoke, CenaRestaurantSmoke]
    defaults:
      run:
        working-directory: native/ios
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Run simulator smoke tests
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          simulator=$(xcrun simctl list devices available -j | python3 -c 'import json, sys; devices = json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime, group in sorted(devices.items(), reverse=True) if "SimRuntime.iOS-" in runtime for device in group if device["name"].startswith("iPhone")))')
          xcodebuild -project Cena.xcodeproj -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$simulator" \
            SUPABASE_URL='' SUPABASE_ANON_KEY='' CENA_API_URL='' CODE_SIGNING_ALLOWED=NO test
