packages:
  - apps/customer
  - apps/restaurant
  - apps/site

nodeLinker: hoisted

# Expo SDK 54 pins Metro internals to 0.83.3. Keep the hoisted dependency graph
# and file watcher on the same event format as Expo's Metro wrapper.
overrides:
  metro: 0.83.3
  metro-config: 0.83.3
  metro-core: 0.83.3
  metro-runtime: 0.83.3
  metro-source-map: 0.83.3
