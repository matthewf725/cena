<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#FAF6F3">
  <title>Return to Cena</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:#FAF6F3; color:#231F1C; font:16px/1.55 system-ui,sans-serif; }
    main { width:100%; max-width:420px; padding:28px; border:1px solid #EDE5E0; border-radius:22px; background:#FFF; }
    strong { color:#5D100A; font-size:24px; letter-spacing:-.06em; }
    h1 { margin:12px 0 6px; font-size:26px; line-height:1.1; letter-spacing:-.025em; }
    p { margin:10px 0 0; }
    a { display:flex; align-items:center; justify-content:center; width:100%; min-height:48px; margin-top:22px; padding:10px 14px; border-radius:14px; background:#5D100A; color:#FFF; font-weight:700; text-decoration:none; text-align:center; }
    a:focus-visible { outline:3px solid #5D100A; outline-offset:3px; }
    .browser-help { color:#605751; font-size:14px; }
  </style>
</head>
<body>
  <main>
    <strong aria-label="Cena">cena</strong>
    <h1 id="title">Return to Cena</h1>
    <p id="next">Check your payment status and pickup details in Cena.</p>
    <a id="open-app" href="cena://checkout/return">Open Cena</a>
    <p class="browser-help">Using Cena in a browser? Switch back to your original tab.</p>
  </main>
  <script>
    if (location.search || location.hash) history.replaceState(null, '', location.pathname);
    const title = document.getElementById('title');
    const next = document.getElementById('next');
    const openApp = document.getElementById('open-app');
    if (location.pathname.startsWith('/restaurant/connect/')) {
      title.textContent = 'Return to Cena for Restaurants';
      next.textContent = 'Check your Stripe setup or request a fresh setup link.';
      openApp.textContent = 'Open Cena for Restaurants';
      openApp.href = 'cena-restaurant://connect/return';
    } else if (location.pathname === '/checkout/cancel') {
      title.textContent = 'Checkout closed';
      next.textContent = 'You can reopen checkout or release the pickup reservation in Cena.';
    }
  </script>
</body>
</html>
